[project]
name = "reelforge"
version = "0.1.0"
description = "Agentic vertical-video editor: transcript-driven cuts, subject-tracked reframing, safe-zone captions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Face-aware reframing. Without it the tracker falls back to saliency, which
# needs nothing beyond numpy.
vision = ["opencv-python-headless>=4.8,<5"]
# Hosted word-level ASR.
transcribe = ["requests>=2.31"]
dev = ["pytest>=8.0"]
all = [
    "opencv-python-headless>=4.8,<5",
    "requests>=2.31",
]

[project.scripts]
reelforge = "reelforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
