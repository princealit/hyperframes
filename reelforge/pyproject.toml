[project]
name = "reelforge"
version = "0.1.0"
description = "Agentic vertical-video editor: transcript-driven cuts, subject-tracked reframing, safe-zone captions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Face-aware reframing. Without it the tracker falls back to saliency, which
# needs nothing beyond numpy.
vision = ["opencv-python-headless>=4.8,<5"]
# Hosted word-level ASR (ElevenLabs Scribe).
transcribe = ["requests>=2.31"]
# Pull footage from YouTube, TikTok, Instagram and friends.
source = ["yt-dlp>=2024.1"]
# Local word-level ASR. No API key, nothing leaves the machine.
local = ["faster-whisper>=1.0"]
# Expose the pipeline as MCP tools for Claude Code / Claude Desktop.
mcp = ["mcp>=2.0", "anyio>=4.0"]
# Serve MCP over HTTP as a remote connector (claude.ai web + mobile).
remote = ["mcp>=2.0", "anyio>=4.0", "uvicorn>=0.30", "starlette>=0.37"]
dev = ["pytest>=8.0", "anyio>=4.0", "mcp>=2.0"]
all = [
    "opencv-python-headless>=4.8,<5",
    "requests>=2.31",
    "faster-whisper>=1.0",
    "mcp>=2.0",
    "anyio>=4.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "yt-dlp>=2024.1",
]

[project.scripts]
reelforge = "reelforge.cli:main"
reelforge-mcp = "reelforge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
